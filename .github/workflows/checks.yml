name: AMCP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check web/app.js
      - run: node deploy/check-railway.mjs
      - run: docker build -t amcp:check .
      - run: node deploy/smoke.mjs
      - run: node deploy/smoke.mjs --writes
