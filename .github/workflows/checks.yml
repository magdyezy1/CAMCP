name: AMCP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tools/prepare-public-release.mjs .release/candidate
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .release/candidate
      - run: AMCP_REQUIRE_FFMPEG=true npm run check 2>&1 | tee release-check.log
        working-directory: .release/candidate
      - run: node deploy/check-railway.mjs
        working-directory: .release/candidate
      - run: docker build -t amcp:check .release/candidate
      - run: docker image inspect --format '{{.Id}}' amcp:check > .release/candidate/release-image.txt
      - run: node deploy/smoke.mjs 2>&1 | tee release-smoke-read.log
        working-directory: .release/candidate
      - run: node deploy/smoke.mjs --writes 2>&1 | tee release-smoke-write.log
        working-directory: .release/candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            .release/candidate/release-manifest.json
            .release/candidate/release-check.log
            .release/candidate/release-smoke-*.log
            .release/candidate/release-image.txt
            .release/candidate/.mirror/REPORTS/implementation-status.json
            .release/candidate/.mirror/REPORTS/compatibility-verification.json
          include-hidden-files: true
